services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: calibration
      POSTGRES_USER: calibration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calibration -d calibration"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://calibration:${POSTGRES_PASSWORD}@db:5432/calibration
      AUTH_MODE: ${AUTH_MODE:-apikey}
      API_KEYS: ${API_KEYS:-}
      SCADA_URL: ${SCADA_URL:-}
      SCADA_AUTH_HEADER: ${SCADA_AUTH_HEADER:-}
      SCADA_TAG_TEMPLATE: ${SCADA_TAG_TEMPLATE:-{asset}.Calibration.{point}}
      SCADA_MAX_ATTEMPTS: ${SCADA_MAX_ATTEMPTS:-12}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
