limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'" always;
  # Terminate TLS at the cloud load balancer, then enable:
  # add_header Strict-Transport-Security "max-age=31536000" always;

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  # Service worker and HTML must never be cached, or updates never reach devices.
  # (expires is used instead of add_header so the security headers above still apply.)
  location = /sw.js { expires -1; try_files $uri =404; }
  location = /index.html { expires -1; }
  location /assets/ { expires 1y; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
